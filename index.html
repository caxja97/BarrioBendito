<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarrioBendito - Multicam</title>
<style>
    body {
        background-image: url('fondo-torneo.png');
        background-size: cover; background-position: center; background-repeat: no-repeat;
        background-attachment: fixed; color: white; font-family: sans-serif;
        margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .container {
        max-width: 500px; background: rgba(22, 27, 34, 0.9); padding: 40px;
        border-radius: 20px; border: 3px solid #de4c4c; box-shadow: 0 0 20px #de4c4c;
        text-align: center;
    }
    h1 { color: #de4c4c; font-size: 2.5em; margin: 0 0 10px 0; }
    input {
        padding: 15px; border-radius: 8px; border: 1px solid #30363d;
        background: #000; color: white; width: 100%; max-width: 300px;
        margin-bottom: 20px; text-align: center; font-size: 16px;
    }
    .btn {
        background: #de4c4c; color: white; padding: 18px; border: none;
        border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;
        max-width: 320px; text-transform: uppercase;
    }
    #linkDisplay {
        display: none; background: #161b22; padding: 20px; border-radius: 10px;
        margin-top: 20px; border: 1px dashed #de4c4c;
    }
    #finalLink { color: #de4c4c; word-break: break-all; font-family: monospace; }
    
    #iframeContainer { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

    <div id="setup">
        <div class="container">
            <h1>BarrioBendito</h1>
            <p>Generador de Link para OBS</p>
            <input type="text" id="playerName" placeholder="Tu nombre de jugador...">
            <button class="btn" onclick="iniciarCaptura()">PASO 1: ELEGIR JUEGO</button>
            
            <div id="linkDisplay">
                <p>✅ ¡CAPTURA LISTA!</p>
                <p>Copia este link y pásalo al admin:</p>
                <div id="finalLink"></div>
            </div>
        </div>
    </div>

    <div id="iframeContainer">
        <iframe id="vdoIframe" allow="camera;microphone;display-capture;autoplay"></iframe>
    </div>

    <script>
        function iniciarCaptura() {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert("Escribe tu nombre primero");

            // CSS que inyectamos para matar el gris y poner tu fondo
            const customCss = `
                #main, .main-content, body, .modal-content, .sub-menu { 
                    background-image: url('https://caxja97.github.io/fondo-torneo.png') !important;
                    background-size: cover !important; background-position: center !important;
                    background-color: #000 !important; color: white !important;
                }
                .button, .card, .setting-container { 
                    background: rgba(0,0,0,0.8) !important; border: 2px solid #de4c4c !important; 
                    box-shadow: 0 0 15px #de4c4c !important;
                }
                h2, h3, p { color: white !important; text-shadow: 0 0 5px #de4c4c !important; }
                #action-button { background: #de4c4c !important; box-shadow: 0 0 15px #de4c4c !important; }
            `;

            const encodedCss = encodeURIComponent(customCss);
            // autostart=1 y screenshare=1 para que vaya directo a pedir la pantalla
            const vdoUrl = `https://vdo.ninja/?push=${name}&screenshare=1&autostart=1&clean=1&css=${encodedCss}`;

            // Abrimos el selector de pantalla en el iframe invisible
            const iframe = document.getElementById('vdoIframe');
            iframe.src = vdoUrl;

            // Mostramos el link generado para el OBS del admin
            const obsLink = `https://vdo.ninja/?view=${name}`;
            document.getElementById('finalLink').innerText = obsLink;
            document.getElementById('linkDisplay').style.display = 'block';
            
            // Opcional: Abrir el iframe si quieres que vean la preview
            // document.getElementById('setup').style.display = 'none';
            // document.getElementById('iframeContainer').style.display = 'block';
        }
    </script>
</body>
</html>
