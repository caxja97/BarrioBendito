<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarrioBendito - Multicam</title>
<style>
    body {
        /* Reemplaza 'URL_DE_TU_IMAGEN_DE_FONDO.jpg' con el enlace a tu imagen real */
        background-image: url('fondo-torneo.png');
        background-size: cover; /* Para que la imagen cubra toda la pantalla */
        background-position: center; /* Centrar la imagen */
        background-repeat: no-repeat;
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh; /* Centrado vertical */
    }
    .container {
        max-width: 500px;
        background: rgba(22, 27, 34, 0.85); /* Fondo semitransparente para leer bien el texto */
        padding: 40px;
        border-radius: 20px;
        border: 3px solid #de4c4c;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7); /* Sombra para dar profundidad */
    }
    h1 { color: #de4c4c; font-size: 2.5em; margin-bottom: 5px; }
    p { color: #ccc; margin-bottom: 30px; }
    input {
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: rgba(1, 4, 9, 0.7);
        color: white;
        width: 100%; /* Ocupa todo el contenedor */
        max-width: 300px; /* Evita que crezca demasiado */
        margin-bottom: 25px;
        box-sizing: border-box; /* Para que el padding no afecte el ancho total */
        font-size: 16px;
    }
    .btn {
        background: #de4c4c;
        color: white;
        padding: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        max-width: 300px;
        font-size: 16px;
        text-transform: uppercase;
        transition: background-color 0.3s ease;
    }
    .btn:hover { background: #ff5e5e; }
    /* Estilos para el contenedor de video */
    #iframeContainer { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: black; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

    <div id="setup">
        <div class="container">
            <h1>BarrioBendito</h1>
            <p>Panel de Multicam para el Torneo</p>
            <input type="text" id="playerName" placeholder="Tu nombre de jugador..."><br>
            <button class="btn" onclick="iniciarCaptura()">COMPARTIR PANTALLA / JUEGO</button>
        </div>
    </div>

    <div id="iframeContainer">
        <iframe id="vdoIframe" allow="camera;microphone;display-capture;autoplay;external-production"></iframe>
    </div>

    <script>
        function iniciarCaptura() {
            const name = document.getElementById('playerName').value;
            if (!name) return alert("Escribe tu nombre primero");

            const vdoUrl = `https://vdo.ninja/?push=${name}&clean=1&autostart=1&nobanner=1&preview=1`;

            document.getElementById('setup').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'block';
            document.getElementById('vdoIframe').src = vdoUrl;
        }
    </script>
</body>
</html>
