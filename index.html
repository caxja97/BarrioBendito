<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarrioBendito - Registro</title>
<style>
    /* Fondo principal de la web con carga prioritaria */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #0a0a0a url('https://raw.githubusercontent.com/caxja97/BarrioBendito/main/fondo-torneo.png') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .container {
        max-width: 450px;
        width: 90%;
        background: rgba(0, 0, 0, 0.85); 
        padding: 40px;
        border-radius: 20px;
        border: 2px solid #de4c4c; 
        box-shadow: 0 0 40px rgba(222, 76, 76, 0.6);
        text-align: center;
        backdrop-filter: blur(8px); /* Efecto de cristal esmerilado */
    }

    h1 { color: #de4c4c; font-size: 2.2em; text-transform: uppercase; margin-bottom: 20px; text-shadow: 2px 2px 5px black; }
    
    input, select {
        padding: 14px; border-radius: 8px; border: 1px solid #444;
        background: rgba(0, 0, 0, 0.9); color: white; width: 100%; 
        margin-bottom: 20px; text-align: center; box-sizing: border-box; font-size: 16px;
    }

    .btn-main {
        background: #de4c4c; color: white; padding: 18px; border: none;
        border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%;
        text-transform: uppercase; transition: 0.3s;
    }

    .btn-main:hover { background: #ff5e5e; transform: scale(1.02); }

    .btn-live {
        display: inline-block; margin-top: 25px; padding: 12px 25px; border: 2px solid #00ff88;
        color: #00ff88; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 13px;
        transition: 0.3s;
    }
    .btn-live:hover { background: #00ff88; color: black; }

    #iframeContainer { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000; background: black; }
</style>
</head>
<body>

    <div id="setup" class="container">
        <h1>BarrioBendito</h1>
        <p style="margin-bottom: 25px; opacity: 0.8;">Panel de Transmisión Oficial</p>
        
        <input type="text" id="playerName" placeholder="Escribe tu Nickname...">
        
        <select id="playerSlot">
            <optgroup label="TORNEO OFICIAL (Público)">
                <option value="puesto1">Puesto 1 (Equipo A)</option>
                <option value="puesto2">Puesto 2 (Equipo A)</option>
                <option value="puesto3">Puesto 3 (Equipo A)</option>
                <option value="puesto4">Puesto 4 (Equipo A)</option>
                <option value="puesto5">Puesto 5 (Equipo A)</option>
                <option value="puesto6">Puesto 1 (Equipo B)</option>
                <option value="puesto7">Puesto 2 (Equipo B)</option>
                <option value="puesto8">Puesto 3 (Equipo B)</option>
                <option value="puesto9">Puesto 4 (Equipo B)</option>
                <option value="puesto10">Puesto 5 (Equipo B)</option>
            </optgroup>
            <optgroup label="MODO LIBRE (Privado)">
                <option value="libre">Uso Libre (Privado)</option>
            </optgroup>
        </select>

        <button class="btn-main" onclick="iniciarCaptura()">TRANSMITIR AHORA</button>
        <br>
        <a href="panel.html" class="btn-live">🔴 VER PANEL EN VIVO</a>
    </div>

    <div id="iframeContainer">
        <iframe id="vdoIframe" allow="camera;microphone;display-capture;autoplay" style="width:100%; height:100%; border:none;"></iframe>
    </div>

    <script>
        function iniciarCaptura() {
            const name = document.getElementById('playerName').value;
            const slot = document.getElementById('playerSlot').value;
            if (!name) return alert("Ingresa tu nombre");

            const fondoUrl = "https://raw.githubusercontent.com/caxja97/BarrioBendito/main/fondo-torneo.png";
            const css = encodeURIComponent(`
                body { background: #0a0a0a url('${fondoUrl}') no-repeat center center fixed !important; background-size: cover !important; }
                #main, .main-content { background: rgba(0,0,0,0.7) !important; backdrop-filter: blur(5px); }
                .button { background: rgba(30,30,30,0.9) !important; border: 2px solid #de4c4c !important; color: white !important; }
                h2, p, i, span { color: white !important; text-shadow: 0 0 10px #de4c4c !important; }
            `);

            document.getElementById('setup').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'block';

            const roomID = "barriobendito_2026";
            let vdoUrl = (slot === "libre") 
                ? `https://vdo.ninja/?push=${name}_${Date.now()}&clean=1&autostart=1&css=${css}`
                : `https://vdo.ninja/?push=${slot}&label=${name}&room=${roomID}&clean=1&autostart=1&css=${css}`;
            
            document.getElementById('vdoIframe').src = vdoUrl;
        }
    </script>
</body>
</html>
