<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarrioBendito - Multicam</title>
<style>
    body {
        background-image: url('fondo-torneo.png');
        background-size: cover; 
        background-position: center; 
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: white;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh; 
    }
    .container {
        max-width: 500px;
        background: rgba(22, 27, 34, 0.85); 
        padding: 40px;
        border-radius: 20px;
        border: 3px solid #de4c4c;
        box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
    }
    h1 { color: #de4c4c; font-size: 2.5em; margin-bottom: 5px; }
    p { color: #ccc; margin-bottom: 30px; }
    input {
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: rgba(1, 4, 9, 0.7);
        color: white;
        width: 100%; 
        max-width: 300px; 
        margin-bottom: 25px;
        box-sizing: border-box; 
        font-size: 16px;
    }
    .btn {
        background: #de4c4c;
        color: white;
        padding: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
        max-width: 300px;
        font-size: 16px;
        text-transform: uppercase;
        transition: background-color 0.3s ease;
    }
    .btn:hover { background: #ff5e5e; }
    #iframeContainer { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; background: black; }
    iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

    <div id="setup">
        <div class="container">
            <h1>BarrioBendito</h1>
            <p>Panel de Multicam para el Torneo</p>
            <input type="text" id="playerName" placeholder="Tu nombre de jugador..."><br>
            <button class="btn" onclick="iniciarCaptura()">COMPARTIR PANTALLA / JUEGO</button>
        </div>
    </div>

    <div id="iframeContainer">
        <iframe id="vdoIframe" allow="camera;microphone;display-capture;autoplay;external-production"></iframe>
    </div>

    <script>
        function iniciarCaptura() {
            const name = document.getElementById('playerName').value;
            if (!name) return alert("Escribe tu nombre primero");

            // CSS personalizado para que VDO.Ninja se vea como BarrioBendito
            const customCss = `
                body { 
                    background-image: url('https://caxja97.github.io/fondo-torneo.png') !important;
                    background-size: cover !important;
                    background-position: center !important;
                    color: white !important;
                }
                #main { background: rgba(0,0,0,0.7) !important; }
                .button { 
                    background: rgba(222, 76, 76, 0.1) !important; 
                    border: 2px solid #de4c4c !important; 
                    border-radius: 15px !important;
                    box-shadow: 0 0 15px rgba(222, 76, 76, 0.5) !important;
                }
                .button:hover { background: rgba(222, 76, 76, 0.3) !important; }
                h2, i { color: white !important; text-shadow: 0 0 10px #de4c4c !important; }
                svg { fill: white !important; }
            `;

            const encodedCss = encodeURIComponent(customCss);
            
            // Unimos tu URL original con el nuevo estilo inyectado
            const vdoUrl = `https://vdo.ninja/?push=${name}&clean=1&autostart=1&nobanner=1&preview=1&css=${encodedCss}`;

            document.getElementById('setup').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'block';
            document.getElementById('vdoIframe').src = vdoUrl;
        }
    </script>
</body>
</html>
